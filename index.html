<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>проекты mdpka</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background-color: #0d0b12;
            color: #e1e1e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== Анимированный фон ===== */
        .bg-anim {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            will-change: transform;
        }

        .blob-1 {
            width: 520px; height: 520px;
            background: #7c3aed;
            top: -160px; left: -140px;
            animation: float1 20s ease-in-out infinite;
        }
        .blob-2 {
            width: 460px; height: 460px;
            background: #a855f7;
            bottom: -180px; right: -120px;
            animation: float2 24s ease-in-out infinite;
        }
        .blob-3 {
            width: 380px; height: 380px;
            background: #4c1d95;
            top: 40%; left: 55%;
            animation: float3 28s ease-in-out infinite;
        }
        .blob-4 {
            width: 300px; height: 300px;
            background: #6d28d9;
            bottom: 10%; left: 15%;
            opacity: 0.35;
            animation: float1 32s ease-in-out infinite reverse;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(120px, 80px) scale(1.15); }
            66%      { transform: translate(-60px, 140px) scale(0.9); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            40%      { transform: translate(-140px, -90px) scale(1.2); }
            75%      { transform: translate(70px, -140px) scale(0.95); }
        }
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-180px, 110px) scale(1.25); }
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(168, 85, 247, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.06) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
        }

        /* ===== Переключатель языка ===== */
        .lang-switch {
            position: fixed;
            top: 16px;
            left: 16px;
            display: flex;
            gap: 6px;
            background: rgba(29, 24, 38, 0.85);
            padding: 6px 10px;
            border-radius: 30px;
            border: 1px solid rgba(168, 85, 247, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .lang-switch button {
            background: transparent;
            border: none;
            color: #a8a8b3;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .lang-switch button.active {
            background: #a855f7;
            color: #121214;
            box-shadow: 0 0 14px rgba(168, 85, 247, 0.6);
        }

        .lang-switch button:hover:not(.active) {
            color: #e1e1e6;
        }

        /* ===== Кнопка гравитации ===== */
        .gravity-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(29, 24, 38, 0.85);
            color: #e1e1e6;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(168, 85, 247, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            z-index: 100;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.1s;
        }

        .gravity-btn:hover {
            background: rgba(45, 35, 58, 0.95);
            border-color: rgba(168, 85, 247, 0.5);
        }

        .gravity-btn:active {
            transform: scale(0.96);
        }

        .gravity-btn.active {
            background: #a855f7;
            color: #121214;
            border-color: #a855f7;
            box-shadow: 0 0 22px rgba(168, 85, 247, 0.6);
        }

        .grav-icon {
            width: 16px;
            height: 16px;
            transition: transform 0.5s cubic-bezier(.5, 1.6, .5, 1);
        }

        .grav-icon.rotated {
            transform: rotate(180deg);
        }

        /* ===== Основное окно ===== */
        .container {
            text-align: center;
            padding: 44px 40px;
            background: rgba(24, 20, 32, 0.82);
            border-radius: 18px;
            border: 1px solid rgba(168, 85, 247, 0.18);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.55),
                0 0 60px rgba(124, 58, 237, 0.12) inset;
            max-width: 720px;
            width: 100%;
            transition: opacity 0.2s;
        }

        h1 {
            color: #c084fc;
            margin: 0 0 26px;
            font-size: 2rem;
            letter-spacing: 0.5px;
            text-shadow: 0 0 24px rgba(168, 85, 247, 0.45);
        }

        .section-title {
            color: #e1e1e6;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 18px;
            opacity: 0.75;
        }

        .section-title::before,
        .section-title::after {
            content: "";
            display: inline-block;
            width: 32px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #a855f7);
            vertical-align: middle;
            margin: 0 12px;
        }

        .section-title::after {
            background: linear-gradient(90deg, #a855f7, transparent);
        }

        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(41, 33, 54, 0.75);
            color: #e1e1e6;
            text-decoration: none;
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.1s;
            border: 1px solid rgba(168, 85, 247, 0.16);
            min-width: 210px;
        }

        .social-link:hover {
            background: rgba(58, 44, 78, 0.9);
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
        }

        .social-link:active {
            transform: scale(0.98);
        }

        .social-link svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            transition: filter 0.2s;
        }

        .social-link:hover svg {
            filter: drop-shadow(0 0 6px currentColor);
        }

        .icon-tg      { color: #26A5E4; fill: #26A5E4; }
        .icon-github  { color: #f5f5f5; fill: #f5f5f5; }
        .icon-youtube { color: #FF0000; fill: #FF0000; }
        .icon-discord { color: #5865F2; fill: #5865F2; }

        /* ===== Gravity active ===== */
        body.gravity-active .container {
            background: transparent;
            border-color: transparent;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            padding: 0;
        }

        body.gravity-active .container * {
            cursor: grab;
        }

        /* ===== Адаптив ===== */
        @media (max-width: 560px) {
            .container {
                padding: 30px 18px;
            }

            h1 {
                font-size: 1.55rem;
                margin-bottom: 20px;
            }

            .social-link {
                min-width: 100%;
                justify-content: center;
                padding: 13px 16px;
            }

            .lang-switch {
                top: 10px;
                left: 10px;
                padding: 4px 8px;
            }

            .lang-switch button {
                padding: 4px 10px;
                font-size: 13px;
            }

            .gravity-btn {
                top: 10px;
                right: 10px;
                padding: 6px 12px;
                font-size: 13px;
            }

            .grav-icon { width: 14px; height: 14px; }

            .section-title::before,
            .section-title::after {
                width: 18px;
                margin: 0 8px;
            }
        }
    </style>
</head>

    <script>
        (function() {
            // ===== DOM =====
            const btnRu        = document.getElementById('btn-ru');
            const btnEn        = document.getElementById('btn-en');
            const mainTitleEl  = document.getElementById('main-title');
            const sectionTitleEl = document.getElementById('section-title');
            const gravityBtn   = document.getElementById('gravity-btn');
            const gravLabel    = document.getElementById('grav-label');
            const gravIcon     = document.getElementById('grav-icon');
            const container    = document.querySelector('.container');

            // ===== Переводы =====
            const translations = {
                ru: { pageTitle: "проекты mdpka", heading: "проекты mdpka", section: "Ссылки" },
                en: { pageTitle: "mdpka's projects", heading: "mdpka's projects", section: "Links" }
            };

            let currentLang = 'ru';

            // ===== Состояние гравитации =====
            let gravityOn    = false;
            let physicsItems = [];
            let rafId        = null;
            let lastTime     = 0;

            // ===== Язык =====
            function applyLanguage(lang) {
                const t = translations[lang];
                currentLang = lang;
                document.title = t.pageTitle;
                mainTitleEl.textContent = t.heading;
                sectionTitleEl.textContent = t.section;
                btnRu.classList.toggle('active', lang === 'ru');
                btnEn.classList.toggle('active', lang === 'en');
                document.documentElement.lang = lang;
                updateGravityButton();
                try { localStorage.setItem('mdpka-lang', lang); } catch (e) {}
            }

            function detectLanguage() {
                let saved = null;
                try { saved = localStorage.getItem('mdpka-lang'); } catch (e) {}
                if (saved === 'ru' || saved === 'en') return saved;
                const bl = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
                return bl.startsWith('ru') ? 'ru' : 'en';
            }

            // ===== Кнопка гравитации =====
            function updateGravityButton() {
                const ru = currentLang === 'ru';
                if (gravityOn) {
                    gravLabel.textContent = ru ? 'Невесомость' : 'Zero-G';
                    gravIcon.classList.add('rotated');
                    gravityBtn.classList.add('active');
                    gravityBtn.title = ru ? 'Включить гравитацию' : 'Enable gravity';
                } else {
                    gravLabel.textContent = ru ? 'Гравитация' : 'Gravity';
                    gravIcon.classList.remove('rotated');
                    gravityBtn.classList.remove('active');
                    gravityBtn.title = ru ? 'Отключить гравитацию' : 'Disable gravity';
                }
            }

            // ===== Включение гравитации =====
            function enableGravity() {
                if (gravityOn) return;
                gravityOn = true;

                const fallable = [
                    mainTitleEl,
                    sectionTitleEl,
                    ...document.querySelectorAll('.social-link')
                ].filter(Boolean);

                physicsItems = [];

                fallable.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    physicsItems.push({
                        el,
                        x: rect.left,
                        y: rect.top,
                        w: rect.width,
                        h: rect.height,
                        vx: (Math.random() - 0.5) * 600,
                        vy: -Math.random() * 300 - 150,
                        rot: 0,
                        vrot: (Math.random() - 0.5) * 540,
                        sleeping: false
                    });

                    el.style.position = 'fixed';
                    el.style.left = rect.left + 'px';
                    el.style.top = rect.top + 'px';
                    el.style.width = rect.width + 'px';
                    el.style.height = rect.height + 'px';
                    el.style.margin = '0';
                    el.style.zIndex = '50';
                    el.style.transformOrigin = 'center center';
                    el.style.transition = 'none';
                });

                document.body.classList.add('gravity-active');
                updateGravityButton();

                lastTime = performance.now();
                rafId = requestAnimationFrame(animateGravity);
            }

            // ===== Физика =====
            function animateGravity(now) {
                if (!gravityOn) return;
                if (!lastTime) lastTime = now;
                let dt = Math.min((now - lastTime) / 1000, 0.05);
                lastTime = now;

                const W = window.innerWidth;
                const H = window.innerHeight;
                const G = 2200;         // px/s²
                let anyActive = false;

                physicsItems.forEach(item => {
                    if (item.sleeping) return;

                    // Сила тяжести
                    item.vy += G * dt;

                    // Сопротивление воздуха
                    item.vx   *= (1 - 0.4 * dt);
                    item.vrot *= (1 - 0.3 * dt);

                    // Интегрирование
                    item.x   += item.vx * dt;
                    item.y   += item.vy * dt;
                    item.rot += item.vrot * dt;

                    // Пол
                    const floor = H - item.h;
                    if (item.y >= floor) {
                        item.y = floor;
                        if (Math.abs(item.vy) > 80) {
                            item.vy *= -0.5;
                            item.vx *= 0.85;
                            item.vrot += (Math.random() - 0.5) * 300;
                        } else {
                            item.vy = 0;
                            item.vx *= 0.85;
                            item.vrot *= 0.8;
                        }
                    }

                    // Потолок
                    if (item.y < 0) {
                        item.y = 0;
                        item.vy = Math.abs(item.vy) * 0.4;
                    }

                    // Стены
                    if (item.x < 0) {
                        item.x = 0;
                        item.vx = Math.abs(item.vx) * 0.55;
                    }
                    if (item.x + item.w > W) {
                        item.x = W - item.w;
                        item.vx = -Math.abs(item.vx) * 0.55;
                    }

                    // Засыпание
                    if (Math.abs(item.vx) < 2 && Math.abs(item.vy) < 2 &&
                        Math.abs(item.vrot) < 2 && item.y >= floor - 1) {
                        item.vx = 0;
                        item.vy = 0;
                        item.vrot = 0;
                        item.sleeping = true;
                    }

                    if (!item.sleeping) anyActive = true;

                    item.el.style.left = item.x + 'px';
                    item.el.style.top = item.y + 'px';
                    item.el.style.transform = 'rotate(' + item.rot + 'deg)';
                });

                if (anyActive) {
                    rafId = requestAnimationFrame(animateGravity);
                } else {
                    rafId = null;
                }
            }

            // ===== Выключение гравитации =====
            function disableGravity() {
                if (!gravityOn) return;
                gravityOn = false;
                if (rafId) cancelAnimationFrame(rafId);
                rafId = null;
                lastTime = 0;

                const els = physicsItems.map(i => i.el);
                const fadeEls = [container, ...els];

                // Фаза 1: плавно гасим всё
                fadeEls.forEach(el => {
                    el.style.transition = 'opacity 0.2s ease-out';
                    el.style.opacity = '0';
                });

                setTimeout(() => {
                    // Фаза 2: возвращаем в нормальный поток
                    document.body.classList.remove('gravity-active');
                    els.forEach(el => { el.style.cssText = ''; });
                    container.style.cssText = '';

                    // Скрываем до fade-in, чтобы не было вспышки
                    els.forEach(el => { el.style.opacity = '0'; });
                    container.style.opacity = '0';

                    // Фаза 3: fade-in в обычном положении
                    requestAnimationFrame(() => {
                        fadeEls.forEach(el => {
                            el.style.transition = 'opacity 0.28s ease-in';
                            el.style.opacity = '1';
                        });

                        setTimeout(() => {
                            fadeEls.forEach(el => {
                                el.style.transition = '';
                                el.style.opacity = '';
                            });
                            physicsItems = [];
                        }, 300);
                    });
                }, 220);

                updateGravityButton();
            }

            // ===== Клик по кнопке =====
            gravityBtn.addEventListener('click', () => {
                if (gravityOn) disableGravity();
                else enableGravity();
            });

            // ===== Ресайз: будим спящие элементы =====
            window.addEventListener('resize', () => {
                if (!gravityOn || !physicsItems.length) return;
                const W = window.innerWidth;
                const H = window.innerHeight;
                physicsItems.forEach(item => {
                    item.x = Math.max(0, Math.min(item.x, W - item.w));
                    item.y = Math.max(0, Math.min(item.y, H - item.h));
                    item.sleeping = false;
                });
                if (!rafId) {
                    lastTime = performance.now();
                    rafId = requestAnimationFrame(animateGravity);
                }
            });

            // ===== Init =====
            applyLanguage(detectLanguage());
            btnRu.addEventListener('click', () => applyLanguage('ru'));
            btnEn.addEventListener('click', () => applyLanguage('en'));
        })();
    </script>
</body>
</html>
