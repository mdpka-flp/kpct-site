<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPCT Projects</title>
    <style>
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: #1d1d22;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #00bcd4;
            margin-bottom: 10px;
        }
        p {
            color: #a8a8b3;
            font-size: 16px;
            line-height: 1.5;
        }
        .server-block {
            background: #29292e;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid #00bcd4;
        }
        .ip-text {
            font-family: monospace;
            background: #121214;
            padding: 4px 8px;
            border-radius: 4px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KPCT Projects</h1>
        <p>Добро пожаловать! Здесь находятся наши игровые и приватные сервисы.</p>
        
        <div class="server-block">
            <strong>KapuctaCraft Server:</strong><br>
            <span class="ip-text">craft.kpct.ru</span>
        </div>
        
        <div class="server-block">
            <strong>CopperTower Server:</strong><br>
            <span class="ip-text">coppertower.kpct.ru</span>
        </div>
        
        <p style="font-size: 12px; color: #737380;">Защищено с помощью Cloudflare и TCPShield</p>
    </div>
</body>
</html>
